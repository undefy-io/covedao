# Local regtest stack.
#
#   pnpm dev:infra         start Postgres + Bitcoin Core and push the DB schema
#   pnpm dev:stack         also start web, worker, and Guardian in Docker
#   pnpm dev:infra:down    stop (keeps the chain and the database)
#   pnpm dev:infra:reset   stop and delete the chain and the database
#   pnpm dev:fees          fees collected at COVE_FEE_ADDRESS (from .env)
#
# Credentials match .env.example. Every port binds to 127.0.0.1 only.
# bitcoind-setup mines 101 blocks and funds the dev wallet identities
# (alice 5 BTC, bob 5 BTC, carol 15 BTC) on a fresh chain; miner then mines one
# block every MINE_INTERVAL seconds so transactions confirm on their own.
# Mine by hand with:
#   docker compose exec bitcoind bitcoin-cli -regtest -rpcuser=user -rpcpassword=pass -rpcwallet=dev -generate 1

x-bitcoin-cli: &bitcoin-cli
  image: bitcoin/bitcoin:30.0
  depends_on:
    bitcoind: { condition: service_healthy }
  entrypoint: ["/bin/sh", "-c"]
  environment:
    CLI: bitcoin-cli -regtest -rpcconnect=bitcoind -rpcport=18443 -rpcuser=user -rpcpassword=pass

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove
      POSTGRES_DB: cove
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove"]
      interval: 3s
      timeout: 3s
      retries: 10

  bitcoind:
    image: bitcoin/bitcoin:30.0
    command:
      - -regtest=1
      - -txindex=1
      - -server=1
      - -printtoconsole
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=user
      - -rpcpassword=pass
      - -fallbackfee=0.0002
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=pass", "getblockchaininfo"]
      interval: 2s
      retries: 60

  bitcoind-setup:
    <<: *bitcoin-cli
    restart: "no"
    command:
      - |
        set -e
        $$CLI loadwallet dev >/dev/null 2>&1 || $$CLI createwallet dev >/dev/null 2>&1 || true
        if [ "$$($$CLI getblockcount)" -lt 101 ]; then
          $$CLI -rpcwallet=dev -generate 101 >/dev/null
          # Dev wallet identities (apps/web/src/app/api/dev/wallet/route.ts).
          $$CLI -rpcwallet=dev sendtoaddress bcrt1qhkfq3zahaqkkzx5mjnamwjsfpq2jk7z08wrkyk 5 >/dev/null
          $$CLI -rpcwallet=dev sendtoaddress bcrt1qcchvzytl5qctjack88c7zp24eklw58dug0ztl2 5 >/dev/null
          $$CLI -rpcwallet=dev sendtoaddress bcrt1q4fwnx4k9x3nhwn7t9k5zacycpzepyf608r5sw8 15 >/dev/null
          $$CLI -rpcwallet=dev -generate 1 >/dev/null
          echo "funded alice, bob and carol"
        fi
        echo "chain height $$($$CLI getblockcount)"

  miner:
    <<: *bitcoin-cli
    depends_on:
      bitcoind-setup: { condition: service_completed_successfully }
    restart: unless-stopped
    command:
      - |
        $$CLI loadwallet dev >/dev/null 2>&1 || true
        while true; do
          sleep $${MINE_INTERVAL:-10}
          $$CLI -rpcwallet=dev -generate 1 >/dev/null || $$CLI loadwallet dev >/dev/null 2>&1
        done

  guardian:
    profiles: [guardian]
    build:
      context: ../guardian
    depends_on:
      postgres: { condition: service_healthy }
      bitcoind: { condition: service_healthy }
    restart: unless-stopped
    environment:
      COVE_NETWORK: regtest
      COVE_CRC_SIGNING_ACTIVE: "true"
      COVE_DATABASE_URL: postgres://cove:cove@postgres:5432/cove
      COVE_BITCOIN_RPC_URL: http://bitcoind:18443
      COVE_BITCOIN_RPC_USER: user
      COVE_BITCOIN_RPC_PASSWORD: pass
      GUARDIAN_AUTH_TOKEN: local-dev
      GUARDIAN_TEST_KEY_HEX: "4242424242424242424242424242424242424242424242424242424242424242"
    ports:
      - "127.0.0.1:4391:4391"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4391/health',{headers:{authorization:'Bearer local-dev'}}).then(r=>r.json()).then(h=>process.exit(h.reachable&&h.auditHealthy&&h.signingJournalHealthy&&h.custodyBackendReady?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    profiles: [app]
    image: covedao-local-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app/apps/worker
    command: ["pnpm", "start"]
    env_file: .env
    environment:
      COVE_NETWORK: regtest
      COVE_CRC_WORKER_ENABLED: "true"
      COVE_DATABASE_URL: postgres://cove:cove@postgres:5432/cove
      COVE_BITCOIN_RPC_URL: http://bitcoind:18443
      COVE_BITCOIN_RPC_USER: user
      COVE_BITCOIN_RPC_PASSWORD: pass
    depends_on:
      postgres: { condition: service_healthy }
      bitcoind: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pnpm", "exec", "tsx", "src/crc-health.ts"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  web:
    profiles: [app]
    image: covedao-local-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app/apps/web
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0"]
    env_file: .env
    environment:
      COVE_NETWORK: regtest
      COVE_CRC_TRADING_ACTIVE: "true"
      COVE_CRC_MARKET_TESTING_ENABLED: "true"
      COVE_GUARDIAN_ENDPOINT: http://guardian:4391
      COVE_GUARDIAN_AUTH_TOKEN: local-dev
      COVE_DATABASE_URL: postgres://cove:cove@postgres:5432/cove
      COVE_BITCOIN_RPC_URL: http://bitcoind:18443
      COVE_BITCOIN_RPC_USER: user
      COVE_BITCOIN_RPC_PASSWORD: pass
    depends_on:
      postgres: { condition: service_healthy }
      bitcoind: { condition: service_healthy }
      worker: { condition: service_healthy }
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/crc/v1/tokens').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  # What the fee address has collected: `pnpm dev:fees`. Reads COVE_FEE_ADDRESS
  # from the repo-root .env (compose loads it), the same value the app uses.
  fees:
    <<: *bitcoin-cli
    profiles: [tools]
    restart: "no"
    environment:
      CLI: bitcoin-cli -regtest -rpcconnect=bitcoind -rpcport=18443 -rpcuser=user -rpcpassword=pass
      FEE_ADDRESS: ${COVE_FEE_ADDRESS:-}
    command:
      - |
        if [ -z "$$FEE_ADDRESS" ]; then echo "COVE_FEE_ADDRESS is not set in .env"; exit 1; fi
        $$CLI scantxoutset start "[\"addr($$FEE_ADDRESS)\"]" \
          | sed -n 's/.*"total_amount": *\([0-9.]*\).*/fees collected at '"$$FEE_ADDRESS"': \1 BTC/p'

  # Legacy V1 mock worker only (apps/worker dev:v1, reindex, demo:reset):
  #   docker compose --profile legacy up -d redis
  redis:
    image: redis:7-alpine
    profiles: [legacy]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  bitcoin-data:
