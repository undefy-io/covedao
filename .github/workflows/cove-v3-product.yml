name: Cove V3 product — real user lifecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  product-e2e:
    name: launch → buy → transfer → redeem → list → P2P fill → cancel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove
          POSTGRES_DB: cove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      COVE_REGTEST_RPC_URL: http://127.0.0.1:18443
      COVE_REGTEST_RPC_USER: user
      COVE_REGTEST_RPC_PASSWORD: pass
      COVE_DATABASE_URL: postgres://cove:cove@127.0.0.1:5432/cove
      COVE_TEST_DATABASE_URL: postgres://cove:cove@127.0.0.1:5432/cove
      COVE_V3_APP_ENABLED: "true"
      COVE_NETWORK: regtest
      COVE_BITCOIN_RPC_URL: http://127.0.0.1:18443
      COVE_BITCOIN_RPC_USER: user
      COVE_BITCOIN_RPC_PASSWORD: pass
      COVE_GUARDIAN_PRIVATE_KEY_HEX: "4242424242424242424242424242424242424242424242424242424242424242"
      COVE_RECOVERY_PRIVATE_KEY_HEX: "4343434343434343434343434343434343434343434343434343434343434343"
      COVE_FEE_PRIVATE_KEY_HEX: "4444444444444444444444444444444444444444444444444444444444444444"
      # E2E-009 mints out a whole curve (about ten BTC). At the real 200,000-sat
      # limit that would take about 5,000 mints; 0.5 BTC takes about twenty.
      COVE_REGTEST_MAX_MINT_GROSS_SATS: "50000000"
      BITCOIN_VERSION: "28.1"
      BITCOIN_SHA256: 07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @crclaunch/web exec playwright install --with-deps chromium

      - name: Build cove-simplicity release binary + verify frozen V3 CMRs
        working-directory: packages/cove-simplicity/rust
        run: |
          set -euo pipefail
          cargo build --release
          BIN=target/release/cove-simplicity
          MINT_CMR=$("$BIN" build mint | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          REDEEM_CMR=$("$BIN" build redeem | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          test "$MINT_CMR" = "7fb27adf2db5458882daf976ba9325815f111b2f3b16eedb72e75f96de4269b2"
          test "$REDEEM_CMR" = "37e681b3e70a34acc3b38680c06fbe4f1b2799bede2607c6c9ed7fcac8c95d56"
          echo "compiled MINT CMR: $MINT_CMR"

      - name: Push V3 schema to Postgres (non-interactive)
        run: pnpm --filter @crclaunch/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.COVE_TEST_DATABASE_URL }}

      - name: Download + checksum-verify pinned Bitcoin Core
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o bitcoin.tar.gz \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_SHA256}  bitcoin.tar.gz" | sha256sum -c -
          tar xzf bitcoin.tar.gz
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoind" /usr/local/bin/
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" /usr/local/bin/
          bitcoind --version

      - name: Start bitcoind -regtest
        run: |
          mkdir -p /tmp/btc-product
          bitcoind -regtest -daemonwait \
            -server=1 -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 -fallbackfee=0.0002 -datadir=/tmp/btc-product \
            -txindex=1 -deprecatedrpc=create_bdb -persistmempool=0
          for i in $(seq 1 60); do
            bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
              -rpcport=18443 getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 createwallet cove-product 2>/dev/null || true
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 loadwallet cove-product 2>/dev/null || true
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 getblockchaininfo

      - name: Build web app
        run: pnpm --filter @crclaunch/web build

      - name: Start V3 worker (background)
        run: |
          nohup pnpm --filter @crclaunch/worker v3 > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid

      - name: Start Next.js web app (background)
        run: |
          nohup pnpm --filter @crclaunch/web start --port 3100 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

      - name: Wait for V3 status API
        run: |
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3100/api/v3/status >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/api/v3/status

      - name: Run Phase 7 product E2E (real Core + Postgres + Simplicity + worker)
        run: pnpm --filter @crclaunch/web exec playwright test

      - name: Final indexer verify
        run: |
          pnpm --filter @crclaunch/cove-indexer v3:verify
          pnpm --filter @crclaunch/cove-indexer v3:verify -- --full

      - name: Dump worker + web logs (on failure)
        if: failure()
        run: |
          tail -60 /tmp/worker.log
          tail -60 /tmp/web.log
          tail -80 /tmp/btc-product/regtest/debug.log
