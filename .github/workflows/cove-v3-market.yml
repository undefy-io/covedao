name: Cove V3 P2P marketplace — production truth gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  market-proof:
    name: fixed-price fill + best-execution + reorg (Core + Postgres + Simplicity)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove
          POSTGRES_DB: cove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      COVE_REGTEST_RPC_URL: http://127.0.0.1:18443
      COVE_REGTEST_RPC_USER: user
      COVE_REGTEST_RPC_PASSWORD: pass
      COVE_DATABASE_URL: postgres://cove:cove@127.0.0.1:5432/cove
      COVE_TEST_DATABASE_URL: postgres://cove:cove@127.0.0.1:5432/cove
      BITCOIN_VERSION: "28.1"
      BITCOIN_SHA256: 07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build cove-simplicity release binary + verify frozen V3 CMRs
        working-directory: packages/cove-simplicity/rust
        run: |
          set -euo pipefail
          cargo build --release
          BIN=target/release/cove-simplicity
          MINT_CMR=$("$BIN" build mint | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          REDEEM_CMR=$("$BIN" build redeem | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          test "$MINT_CMR" = "7fb27adf2db5458882daf976ba9325815f111b2f3b16eedb72e75f96de4269b2"
          test "$REDEEM_CMR" = "37e681b3e70a34acc3b38680c06fbe4f1b2799bede2607c6c9ed7fcac8c95d56"
          echo "compiled MINT CMR: $MINT_CMR"
          echo "compiled REDEEM CMR: $REDEEM_CMR"

      - name: Push V3 schema to Postgres (non-interactive)
        run: pnpm --filter @crclaunch/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.COVE_TEST_DATABASE_URL }}

      - name: Download + checksum-verify pinned Bitcoin Core
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o bitcoin.tar.gz \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_SHA256}  bitcoin.tar.gz" | sha256sum -c -
          tar xzf bitcoin.tar.gz
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoind" /usr/local/bin/
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" /usr/local/bin/
          bitcoind --version

      - name: Start bitcoind -regtest
        run: |
          mkdir -p /tmp/btc-market
          bitcoind -regtest -daemonwait \
            -server=1 -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 -fallbackfee=0.0002 -datadir=/tmp/btc-market \
            -txindex=1 -deprecatedrpc=create_bdb -persistmempool=0
          for i in $(seq 1 60); do
            bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
              -rpcport=18443 getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 getblockchaininfo

      # The harness throws (non-zero exit) if Core/Postgres is unreachable or any
      # step is rejected — it does NOT skip. A red CI run is the intended signal.
      - name: Run fixed-price marketplace proof (fails, not skips)
        run: pnpm --filter @crclaunch/cove-market market-regtest

      - name: Dump bitcoind debug log (on failure)
        if: failure()
        run: tail -80 /tmp/btc-market/regtest/debug.log
