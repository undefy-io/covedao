# Publishing is off: the organization has disabled GitHub Pages. This builds
# the docs on every change; re-enable the deploy job once Pages is allowed.
name: Docs — build

on:
  push:
    branches: [main]
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crclaunch/docs build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/build
