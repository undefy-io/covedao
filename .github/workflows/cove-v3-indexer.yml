name: Cove V3 indexer — persistent truth gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  persistent-proof:
    name: Postgres == Bitcoin replay (lifecycle + reorg + rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove
          POSTGRES_DB: cove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      COVE_REGTEST_RPC_URL: http://127.0.0.1:18443
      COVE_REGTEST_RPC_USER: user
      COVE_REGTEST_RPC_PASSWORD: pass
      COVE_DATABASE_URL: postgres://cove:cove@127.0.0.1:5432/cove
      COVE_TEST_DATABASE_URL: postgres://cove:cove@127.0.0.1:5432/cove
      BITCOIN_VERSION: "28.1"
      BITCOIN_SHA256: 07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build cove-simplicity release binary (fail if missing)
        run: pnpm --filter @crclaunch/cove-simplicity build:rust

      - name: Push V3 schema to Postgres (non-interactive)
        run: pnpm --filter @crclaunch/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.COVE_TEST_DATABASE_URL }}

      - name: Run durable signer store integration test (journal + audit vs Postgres)
        run: pnpm --filter @crclaunch/cove-app test -- journal-audit.integration.test.ts
        env:
          COVE_TEST_DATABASE_URL: ${{ env.COVE_TEST_DATABASE_URL }}

      - name: Download + checksum-verify pinned Bitcoin Core
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o bitcoin.tar.gz \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_SHA256}  bitcoin.tar.gz" | sha256sum -c -
          tar xzf bitcoin.tar.gz
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoind" /usr/local/bin/
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" /usr/local/bin/
          bitcoind --version

      - name: Start bitcoind -regtest
        run: |
          mkdir -p /tmp/btc-v3
          bitcoind -regtest -daemonwait \
            -server=1 -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 -fallbackfee=0.0002 -datadir=/tmp/btc-v3 \
            -txindex=1 -deprecatedrpc=create_bdb -persistmempool=0
          for i in $(seq 1 60); do
            bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
              -rpcport=18443 getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 getblockchaininfo

      - name: Run Postgres all-op store test (must not skip)
        run: pnpm --filter @crclaunch/cove-indexer test -- v3/store.test.ts
        env:
          COVE_TEST_DATABASE_URL: ${{ env.COVE_TEST_DATABASE_URL }}

      - name: Run deterministic golden-root tests
        run: pnpm --filter @crclaunch/cove-indexer test -- v3/golden-root.test.ts

      - name: Run persistent lifecycle (Postgres + Core, no skip)
        run: pnpm --filter @crclaunch/cove-indexer v3:persistent-lifecycle



      - name: Run persistent reorg matrix (Postgres + Core, no skip)
        run: pnpm --filter @crclaunch/cove-indexer v3:persistent-reorg-matrix

      - name: Persistent status
        run: pnpm --filter @crclaunch/cove-indexer v3:status

      - name: Persistent quick verify
        run: pnpm --filter @crclaunch/cove-indexer v3:verify

      - name: Persistent full verify
        run: pnpm --filter @crclaunch/cove-indexer v3:verify -- --full

      - name: Record canonical root before reindex
        run: pnpm --filter @crclaunch/cove-indexer v3:status | tee /tmp/pre-reindex-status.txt

      - name: Persistent reindex
        run: pnpm --filter @crclaunch/cove-indexer v3:reindex

      - name: Post-reindex quick verify
        run: pnpm --filter @crclaunch/cove-indexer v3:verify

      - name: Post-reindex full verify
        run: pnpm --filter @crclaunch/cove-indexer v3:verify -- --full

      - name: Install postgresql-client (backup/restore drill)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Backup/restore drill (pg_dump → separate DB → same state root + rows survive)
        run: |
          set -euo pipefail
          export PGPASSWORD=cove
          LIVE="postgres://cove:cove@127.0.0.1:5432/cove"
          RESTORE="postgres://cove:cove@127.0.0.1:5432/cove_restore_check"
          # Extract the stateRoot from `v3:status` (tolerates the pnpm banner).
          root() { COVE_DATABASE_URL="$1" pnpm --filter @crclaunch/cove-indexer v3:status | grep -o '"stateRoot": *"[0-9a-f]*"' | head -1 | cut -d'"' -f4; }
          ROOT_BEFORE=$(root "$LIVE")
          TOKENS_BEFORE=$(psql -h 127.0.0.1 -U cove -d cove -tAc 'SELECT COUNT(*) FROM cove_v3_tokens;')
          pg_dump -h 127.0.0.1 -U cove --no-owner --format=custom --file=/tmp/cove.dump cove
          dropdb -h 127.0.0.1 -U cove --if-exists cove_restore_check
          createdb -h 127.0.0.1 -U cove cove_restore_check
          pg_restore -h 127.0.0.1 -U cove --no-owner --dbname=cove_restore_check /tmp/cove.dump
          ROOT_AFTER=$(root "$RESTORE")
          TOKENS_AFTER=$(psql -h 127.0.0.1 -U cove -d cove_restore_check -tAc 'SELECT COUNT(*) FROM cove_v3_tokens;')
          test -n "$ROOT_BEFORE" && test -n "$ROOT_AFTER"
          test "$ROOT_BEFORE" = "$ROOT_AFTER"
          test "$TOKENS_BEFORE" = "$TOKENS_AFTER"
          test "$TOKENS_AFTER" -ge 1
          echo "backup/restore drill PASSED — state root $ROOT_AFTER, token rows $TOKENS_AFTER"

      - name: Dump bitcoind debug log (on failure)
        if: failure()
        run: tail -80 /tmp/btc-v3/regtest/debug.log
