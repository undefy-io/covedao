name: covedao-signet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove
      POSTGRES_DB: cove_signet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove_signet"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: covedao-signet-app
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        COVE_NETWORK: signet
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}
    working_dir: /app/packages/db
    command: ["pnpm", "db:migrate"]
    env_file: .env.signet.local
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  worker:
    image: covedao-signet-app
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        COVE_NETWORK: signet
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}
    working_dir: /app/apps/worker
    command: ["pnpm", "start"]
    env_file: .env.signet.local
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "src/health.mjs"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  web:
    image: covedao-signet-app
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        COVE_NETWORK: signet
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}
    working_dir: /app/apps/web
    command: ["pnpm", "exec", "next", "start", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: production
    env_file: .env.signet.local
    depends_on:
      worker: { condition: service_healthy }
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v3/status').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s

volumes:
  pgdata:
